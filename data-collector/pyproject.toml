[project]
name = "air-quality-collector"
version = "0.1.0"
description = "Polls the Open-Meteo air quality API and stores european_aqi, pm2_5 and pm10 as JSON and XML."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
air-quality-collector = "air_quality_collector.main:main"
air-quality-healthcheck = "air_quality_collector.healthcheck:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/air_quality_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
